[package]
name = "gsr-broadcastbox"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "GPU Screen Recorder WHIP broadcaster with a TUI, tray indicator and monitor picker"
license = "MIT"

[[bin]]
name = "gsr-broadcastbox"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.102"
dirs = "=6.0.0"
ksni = { version = "=0.3.7", default-features = false, features = ["blocking", "async-io"] }
libc = "=0.2.186"
ratatui = "=0.30.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=1.1.6"
toml_edit = "=0.25.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
